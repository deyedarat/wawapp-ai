<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول Admin - WawApp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00704A 0%, #005a3c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #00704A;
            text-align: center;
            margin-bottom: 10px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .success-box {
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .success-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .success-text {
            color: #155724;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #00704A;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00704A 0%, #005a3c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 112, 74, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .logout-btn {
            background: linear-gradient(135deg, #666 0%, #444 100%);
        }

        .message {
            padding: 16px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
            font-weight: 500;
            white-space: pre-line;
            font-size: 14px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00704A;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auto-note {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ تسجيل دخول Admin</h1>
        <p class="subtitle">Admin Login - Fresh Session</p>

        <div class="success-box">
            <div class="success-icon">🎉</div>
            <div class="success-text">
                <strong>تم إنشاء حساب Admin بنجاح!</strong><br>
                الآن سجل دخول لتحميل الصلاحيات الجديدة
            </div>
        </div>

        <button onclick="signOut()" class="logout-btn" id="logoutBtn">
            1️⃣ تسجيل الخروج أولاً
        </button>

        <form onsubmit="signIn(); return false;">
            <div class="form-group">
                <label for="email">📧 البريد الإلكتروني:</label>
                <input type="email" id="email" value="myadmin@wawapp.co" required>
            </div>

            <div class="form-group">
                <label for="password">🔒 كلمة المرور:</label>
                <input type="password" id="password" value="Madmin1234" required>
            </div>

            <button type="submit" id="loginBtn">
                2️⃣ تسجيل الدخول
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>جاري المعالجة...</p>
        </div>

        <div id="message" class="message"></div>

        <p class="auto-note">💡 سيتم تسجيل الخروج تلقائياً عند فتح الصفحة</p>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut as firebaseSignOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyBO67aaNMqotGFF73jlCB8uVGUQ5bILfVM',
            authDomain: 'wawapp-952d6.firebaseapp.com',
            projectId: 'wawapp-952d6',
            storageBucket: 'wawapp-952d6.firebasestorage.app',
            messagingSenderId: '363341993641',
            appId: '1:363341993641:web:617f5384a6162a8b683bb8'
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Auto sign out on page load
        window.addEventListener('load', async () => {
            if (auth.currentUser) {
                console.log('Auto signing out...');
                await firebaseSignOut(auth);
                showMessage('✅ تم تسجيل الخروج تلقائياً\nالآن يمكنك تسجيل الدخول من جديد', 'success');
            }
        });

        window.signOut = async function() {
            const logoutBtn = document.getElementById('logoutBtn');
            const messageDiv = document.getElementById('message');

            logoutBtn.disabled = true;
            messageDiv.style.display = 'none';

            try {
                await firebaseSignOut(auth);
                showMessage('✅ تم تسجيل الخروج بنجاح', 'success');
                console.log('✅ Signed out');
            } catch (error) {
                console.error('Error signing out:', error);
                showMessage('❌ خطأ في تسجيل الخروج: ' + error.message, 'error');
            } finally {
                logoutBtn.disabled = false;
            }
        };

        window.signIn = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            const loadingDiv = document.getElementById('loading');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loadingDiv.style.display = 'block';
            messageDiv.style.display = 'none';

            try {
                console.log('🔐 Signing in...');

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                console.log('✅ Signed in:', user.uid);

                // Get token with claims
                const idTokenResult = await user.getIdTokenResult(true);
                console.log('Claims:', idTokenResult.claims);

                const isAdmin = idTokenResult.claims.isAdmin === true;

                if (isAdmin) {
                    showMessage(
                        '✅ تم تسجيل الدخول بنجاح!\n\n' +
                        '📧 البريد: ' + email + '\n' +
                        '🔑 UID: ' + user.uid + '\n' +
                        '👑 صلاحية Admin: نعم\n\n' +
                        '🎉 سيتم التحويل للوحة التحكم بعد 3 ثواني...',
                        'success'
                    );

                    setTimeout(() => {
                        window.location.href = 'https://wawapp-952d6.web.app';
                    }, 3000);
                } else {
                    showMessage(
                        '⚠️ تم تسجيل الدخول لكن صلاحية Admin غير موجودة!\n\n' +
                        'يرجى الانتظار دقيقة واحدة ثم المحاولة مرة أخرى.\n' +
                        '(قد تحتاج الـ claims إلى وقت للانتشار)',
                        'info'
                    );
                }

            } catch (error) {
                console.error('❌ Error:', error);

                let errorMessage = 'حدث خطأ: ';
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    errorMessage += 'كلمة المرور غير صحيحة';
                } else if (error.code === 'auth/user-not-found') {
                    errorMessage += 'المستخدم غير موجود';
                } else {
                    errorMessage += error.message;
                }

                showMessage('❌ ' + errorMessage, 'error');
            } finally {
                loginBtn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        };

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
