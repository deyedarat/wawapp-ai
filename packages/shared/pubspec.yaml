name: shared
description: Shared models, services, and utilities for WawApp laundry management system.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.0
  intl: ^0.19.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  provider: ^6.1.1
  flutter_local_notifications: ^17.0.0
  cached_network_image: ^3.3.1
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
