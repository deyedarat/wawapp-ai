name: wawapp
repository: https://github.com/deyedarat/wawapp-ai

packages:
  - apps/*
  - packages/*

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: melos exec -- dart analyze .
  format:
    run: melos exec -- dart format .
  clean:
    run: melos exec -- flutter clean
