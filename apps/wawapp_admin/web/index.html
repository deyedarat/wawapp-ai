<!DOCTYPE html>
<html lang="ar">

<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WawApp Admin</title>

  <!-- Google Fonts: Tajawal (Arabic) + Inter (Latin fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    body {
      background-color: #0A1612;
      margin: 0;
      padding: 0;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #00704A;
      font-family: sans-serif;
      font-size: 1.2em;
      z-index: 9999;
      background-color: #0A1612;
    }

    /* Global thin scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.12) transparent;
    }
  </style>
</head>

<body>
  <div id="loading">جارٍ التحميل...</div>

  <!-- Fix: scroll-wheel zoom without Ctrl key on web -->
  <style>
    .gm-style iframe+div {
      pointer-events: none !important;
    }
  </style>

  <script>
    function removeLoading() {
      var el = document.getElementById('loading');
      if (el) el.remove();
    }
    window.addEventListener('flutter-first-frame', removeLoading);
    setTimeout(removeLoading, 10000);
  </script>

  <!-- Google Maps JS API: must load BEFORE Flutter to register the web platform plugin -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDF_TYfDGqpoZtYLSYBFvjAPva6Qp3S6Bs&libraries=places&language=ar"></script>

  <!-- Flutter bootstrap: loads after Maps JS API is synchronously available -->
  <script src="flutter_bootstrap.js" defer></script>
</body>

</html>
