<!DOCTYPE html>
<html lang="ar">

<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WawApp Admin</title>

  <style>
    body {
      background-color: #0A1612;
      margin: 0;
      padding: 0;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #00704A;
      font-family: sans-serif;
      font-size: 1.2em;
      z-index: 9999;
      background-color: #0A1612;
    }
  </style>
</head>

<body>
  <div id="loading">جارٍ التحميل...</div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    function removeLoading() {
      var el = document.getElementById('loading');
      if (el) el.remove();
    }
    // Method 1: flutter-first-frame event
    window.addEventListener('flutter-first-frame', removeLoading);
    // Method 2: fallback after 10 seconds
    setTimeout(removeLoading, 10000);
  </script>
</body>

</html>
